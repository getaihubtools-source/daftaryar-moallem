function exportPerformanceExcel(){
  const students = studentsOfClass(currentClassId);
  const rows = [['نام دانش‌آموز','درصد حضور','میانگین نمرات','میانگین آزمون‌ها','درصد انجام تکالیف','تعداد موارد نیازمند توجه']];
  students.forEach(s=>{
    const att = computeAttendanceStats(s.id);
    const asg = computeAssignmentStats(s.id, currentClassId);
    const gradeVals = DATA.subjects.map(sub=>{
      const g = ((DATA.grades[s.id]||{})[sub])||{};
      const nums = [g.classwork, g.exam].filter(v=>v!=null);
      return nums.length ? nums.reduce((a,b)=>a+Number(b),0)/nums.length : null;
    }).filter(v=>v!=null);
    const gradeAvg = gradeVals.length ? Math.round((gradeVals.reduce((a,b)=>a+b,0)/gradeVals.length)*10)/10 : '';
    const examRecs = studentExamRecords(s.id, currentClassId);
    const examAvg = examRecs.length ? Math.round(examRecs.reduce((a,r)=>a+r.pct,0)/examRecs.length) : '';
    const flags = computeAttentionFlags(s.id, currentClassId);
    rows.push([fullName(s), att.total?att.pct+'٪':'', gradeAvg, examAvg!==''?examAvg+'٪':'', asg.total?asg.pct+'٪':'', flags.length]);
  });
  downloadExcelSheet(rows, 'گزارش عملکرد', 'گزارش-عملکرد');
}

    </div>

    <div class="panel">
      <div class="panel-head"><h3>مدیریت دروس</h3></div>
      <div class="panel-body" style="padding:0">
        <div class="table-wrap"><table><thead><tr><th>نام درس</th><th style="width:170px"></th></tr></thead>
        <tbody>
          ${DATA.subjects.map(sub=>`<tr>
            <td style="font-weight:600">${esc(sub)}</td>
            <td>
              <div class="row-actions">
                <button class="icon-btn ghost" title="ویرایش" onclick="renameSubject('${escJs(sub)}')">${ICON_EDIT_SM}</button>
                <button class="icon-btn danger" title="حذف" onclick="deleteSubject('${escJs(sub)}')">${ICON_TRASH_SM}</button>
              </div>
            </td>
          </tr>`).join('')}
        </tbody></table></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>پشتیبان‌گیری</h3><div class="hint">اطلاعات دفتریار معلم روی همین دستگاه ذخیره می‌شود. برای جلوگیری از از دست رفتن اطلاعات، به‌صورت دوره‌ای پشتیبان بگیرید.</div></div>
      <div class="panel-body">
        <p id="backupStatusLine" style="font-size:13px;margin-bottom:12px">${backupStatusHtml()}</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <button class="btn primary" id="exportBtn">دریافت فایل پشتیبان کامل (JSON)</button>
          <label class="btn" style="cursor:pointer">
            بازیابی از فایل پشتیبان
            <input type="file" id="importFile" accept="application/json" style="display:none">
          </label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>خروجی اکسل</h3><div class="hint">خروجی‌های جدا برای هر بخش، برای کلاس فعلی</div></div>
      <div class="panel-body" style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn sm" id="expStudentsBtn">فهرست دانش‌آموزان</button>
        <button class="btn sm" id="expAttendanceBtn">حضور و غیاب</button>
        <button class="btn sm" id="expGradesBtn">نمرات</button>
        <button class="btn sm" id="expExamsBtn">آزمون‌ها</button>
        <button class="btn sm" id="expAssignBtn">تکالیف و فعالیت‌ها</button>
        <button class="btn sm" id="expPerfBtn">گزارش عملکرد دانش‌آموزان</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>پاک‌سازی</h3></div>
      <div class="panel-body">
        <button class="btn danger" id="wipeBtn">حذف کامل همه اطلاعات</button>
      </div>
    </div>`;

  document.getElementById('saveMetaBtn').addEventListener('click', ()=>{
    DATA.meta.teacherName = document.getElementById('setTeacher').value.trim();
    DATA.meta.schoolName = document.getElementById('setSchool').value.trim();
    saveData(); toast('ذخیره شد');
  });
  const pwaInstallBtn = document.getElementById('pwaInstallBtn');
  if(pwaInstallBtn){
    pwaInstallBtn.addEventListener('click', async ()=>{
      if(!pwaDeferredPrompt) return;
      pwaDeferredPrompt.prompt();
      try{ await pwaDeferredPrompt.userChoice; }catch(e){}
      pwaDeferredPrompt = null;
      viewSettings();
    });
  }
  const pwaGuideBtn = document.getElementById('pwaGuideBtn');
  if(pwaGuideBtn){
    pwaGuideBtn.addEventListener('click', openPwaGuideModal);
  }
  const logoFileInput = document.getElementById('logoFileInput');
  if(logoFileInput){
    logoFileInput.addEventListener('change', e=>{
      const file = e.target.files[0]; if(!file) return;
      if(!file.type.startsWith('image/')){ toast('لطفاً یک فایل تصویری انتخاب کنید'); e.target.value=''; return; }
      if(file.size > 2*1024*1024){ toast('حجم تصویر باید کمتر از ۲ مگابایت باشد'); e.target.value=''; return; }
      const reader = new FileReader();
      reader.onload = ev=>{
        DATA.meta.schoolLogo = ev.target.result;
        saveData(); toast('لوگو ذخیره شد'); viewSettings();
      };
      reader.onerror = ()=>{ toast('بارگذاری تصویر با خطا مواجه شد'); };
      reader.readAsDataURL(file);
    });
  }
  const removeLogoBtn = document.getElementById('removeLogoBtn');
  if(removeLogoBtn){
    removeLogoBtn.addEventListener('click', ()=>{
      DATA.meta.schoolLogo = null;
      saveData(); toast('لوگو حذف شد'); viewSettings();
    });
  }
  document.getElementById('exportBtn').addEventListener('click', ()=>{
    downloadBackupFile();
    DATA.meta.lastBackupAt = Date.now();
    saveData();
    const line = document.getElementById('backupStatusLine');
    if(line) line.innerHTML = backupStatusHtml();
    toast('فایل پشتیبان دریافت شد');
  });
  document.getElementById('expStudentsBtn').addEventListener('click', exportStudentsExcel);
  document.getElementById('expAttendanceBtn').addEventListener('click', exportAttendanceExcel);
  document.getElementById('expGradesBtn').addEventListener('click', exportGradesExcel);
  document.getElementById('expExamsBtn').addEventListener('click', exportAllExamsExcel);
  document.getElementById('expAssignBtn').addEventListener('click', exportAssignmentsExcel);
  document.getElementById('expPerfBtn').addEventListener('click', exportPerformanceExcel);

  document.getElementById('importFile').addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      let parsed;
      try{
        parsed = JSON.parse(ev.target.result);
      }catch(err){ toast('این فایل یک پشتیبان معتبر نیست'); e.target.value=''; return; }
      if(!parsed || !Array.isArray(parsed.classes) || !Array.isArray(parsed.students)){
        toast('این فایل یک پشتیبان معتبر نیست');
        e.target.value = '';
        return;
      }
      openModal('بازیابی اطلاعات', `
        <p>با این کار، تمام اطلاعات فعلی دفتریار معلم (دانش‌آموزان، حضور و غیاب، نمرات، آزمون‌ها، تکالیف و یادداشت‌ها) با اطلاعات فایل انتخاب‌شده جایگزین می‌شود.</p>
        <p style="color:var(--absent);font-weight:600">این عملیات قابل بازگشت نیست، مگر اینکه از اطلاعات فعلی هم پشتیبان داشته باشید.</p>
        <div class="form-actions">
          <button class="btn ghost" id="preBackupBtn">ابتدا از اطلاعات فعلی پشتیبان بگیر</button>
        </div>
        <div class="form-actions">
          <button class="btn danger" id="confirmRestoreBtn">بله، جایگزین کن</button>
          <button class="btn ghost" onclick="closeModal()">انصراف</button>
        </div>`);
      document.getElementById('preBackupBtn').addEventListener('click', ()=>{
        downloadBackupFile();
        DATA.meta.lastBackupAt = Date.now();
        saveData();
        toast('فایل پشتیبان دریافت شد');
      });
      document.getElementById('confirmRestoreBtn').addEventListener('click', ()=>{
        parsed.assignments = parsed.assignments || [];
        parsed.assignmentStatus = parsed.assignmentStatus || {};
        parsed.subjects = (parsed.subjects && parsed.subjects.length) ? parsed.subjects : ['درس اصلی'];
        parsed.grades = parsed.grades || {};
        parsed.attendance = parsed.attendance || {};
        parsed.notes = parsed.notes || {};
        parsed.observations = parsed.observations || {};
        parsed.gradeHistory = parsed.gradeHistory || {};
        parsed.exams = parsed.exams || [];
        parsed.examScores = parsed.examScores || {};
        parsed.meta = parsed.meta || {};
        if(parsed.meta.lastBackupAt === undefined) parsed.meta.lastBackupAt = null;
        if(parsed.meta.schoolLogo === undefined) parsed.meta.schoolLogo = null;
        parsed.schemaVersion = CURRENT_SCHEMA_VERSION;
        try{
          DATA = parsed;
          currentClassId = DATA.classes[0] ? DATA.classes[0].id : null;
          currentSubject = DATA.subjects[0];
          openAssignmentId = null;
          currentExamId = null;
          profileStudentId = null;
          saveData();
          closeModal();
          e.target.value = '';
          toast('بازیابی با موفقیت انجام شد');
          render();
        }catch(err){
          toast('بازیابی انجام نشد؛ اطلاعات قبلی شما دست‌نخورده باقی ماند');
        }
      });
    };
    reader.onerror = ()=>{ toast('خواندن فایل با خطا مواجه شد'); e.target.value=''; };
    reader.readAsText(file);
  });
  document.getElementById('wipeBtn').addEventListener('click', ()=>{
    openModal('حذف کامل اطلاعات', `
      <p>همه کلاس‌ها، دانش‌آموزان، حضور و غیاب، نمرات، آزمون‌ها، تکالیف و یادداشت‌ها برای همیشه حذف می‌شود.</p>
      <p style="color:var(--absent);font-weight:600">این عملیات قابل بازگشت نیست.</p>
      <div class="form-actions">
        <button class="btn ghost" id="preWipeBackupBtn">ابتدا پشتیبان بگیر</button>
      </div>
      <div class="form-actions">
        <button class="btn danger" id="confirmWipeBtn">بله، همه چیز حذف شود</button>
        <button class="btn ghost" onclick="closeModal()">انصراف</button>
      </div>`);
    document.getElementById('preWipeBackupBtn').addEventListener('click', ()=>{
      downloadBackupFile();
      DATA.meta.lastBackupAt = Date.now();
      saveData();
      toast('فایل پشتیبان دریافت شد');
    });
    document.getElementById('confirmWipeBtn').addEventListener('click', ()=>{
      DATA = defaultData();
      currentClassId = DATA.classes[0].id;
      currentSubject = DATA.subjects[0];
      openAssignmentId = null;
      currentExamId = null;
      profileStudentId = null;
      saveData(); closeModal(); render();
    });
  });
}

/* =======================================================================
   روتر ساده
======================================================================= */
const TITLES = {
  dashboard:['داشبورد','نمای کلی امروز کلاس شما'],
  students:['دانش‌آموزان','افزودن، ویرایش و افزودن گروهی از اکسل'],
  attendance:['حضور و غیاب','ثبت روزانه با یک کلیک'],
  grades:['نمرات','ثبت نمره کلاسی، امتحان و ارزیابی توصیفی'],
  assignments:['تکالیف و فعالیت‌ها','تعریف و پیگیری وضعیت انجام هر دانش‌آموز'],
  exams:['آزمون‌ها','ثبت آزمون برگزارشده، نمرات و تحلیل نتایج'],
  reports:['گزارش‌ها','گزارش فردی و کلاسی، قابل چاپ'],
  settings:['تنظیمات','اطلاعات کلی، کلاس‌ها، دروس و پشتیبان‌گیری']
};

function render(){
  if(!currentClassId && DATA.classes.length) currentClassId = DATA.classes[0].id;
  renderShell();
  if(profileStudentId){
    document.getElementById('pageTitle').textContent = 'پرونده دانش‌آموز';
    document.getElementById('pageSub').textContent = 'خلاصه وضعیت، حضور، نمرات، تکالیف و یادداشت‌ها';
    viewStudentProfile(profileStudentId);
    return;
  }
  const t = TITLES[currentView] || TITLES.dashboard;
  document.getElementById('pageTitle').textContent = t[0];
  document.getElementById('pageSub').textContent = t[1];
  ({
    dashboard: viewDashboard,
    students: viewStudents,
    attendance: viewAttendance,
    grades: viewGrades,
    assignments: viewAssignments,
    exams: viewExams,
    reports: viewReports,
    settings: viewSettings
  }[currentView] || viewDashboard)();
}

initLicenseGate();

</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){ /* خطای ثبت نباید برنامه را مختل کند */ });
    });
  }
</script>
</body>
</html>
