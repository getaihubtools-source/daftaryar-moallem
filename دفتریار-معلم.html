<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#234F42">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23234F42%22/%3E%3Crect%20x%3D%2213%22%20y%3D%2214%22%20width%3D%2238%22%20height%3D%2236%22%20rx%3D%223.5%22%20fill%3D%22none%22%20stroke%3D%22%23C98A2A%22%20stroke-width%3D%223.2%22/%3E%3Cline%20x1%3D%2213%22%20y1%3D%2223.5%22%20x2%3D%2251%22%20y2%3D%2223.5%22%20stroke%3D%22%23C98A2A%22%20stroke-width%3D%222.2%22/%3E%3Cpath%20d%3D%22M20%2037%20L27%2044%20L43%2028%22%20fill%3D%22none%22%20stroke%3D%22%23C98A2A%22%20stroke-width%3D%223.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="دفتر یار معلم">
<!-- برای تغییر برند: همین‌جا <title> و پایین‌تر در .nav-brand را عوض کنید -->
<title>دفتر یار معلم</title>
<style>
  :root{
    --paper:#F5F2EC;
    --paper-line:#E7E1D3;
    --surface:#FFFFFF;
    --border:#E4DFD3;
    --ink:#23303A;
    --ink-soft:#5B6670;
    --ink-faint:#8B9298;
    --primary:#2F6F5E;
    --primary-dark:#234F42;
    --primary-tint:#E4EFEB;
    --gold:#C98A2A;
    --gold-tint:#F6E9D3;
    --present:#3B8F63;
    --present-tint:#E3F1E9;
    --absent:#C1554A;
    --absent-tint:#F8E7E5;
    --late:#D9A441;
    --late-tint:#FBF0DC;
    --excused:#6B7FA3;
    --excused-tint:#E9ECF3;
    --radius:8px;
    --radius-sm:5px;
    --shadow:0 1px 2px rgba(35,48,58,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{ height:100%; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Vazirmatn','IRANSans','Tahoma',sans-serif;
    font-size:15px;
    line-height:1.7;
    min-height:100vh;
    min-height:100dvh;
    overscroll-behavior-y:none;
    -webkit-tap-highlight-color:transparent;
  }
  button{ touch-action:manipulation; }
  button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  h1,h2,h3,h4{ margin:0; font-weight:700; }
  p{ margin:0; }
  button{ cursor:pointer; border:none; background:none; }
  a{ color:inherit; }

  /* ---------- App shell ---------- */
  .app{
    display:grid;
    grid-template-columns:216px 1fr;
    min-height:100vh;
  }
  .nav{
    background:var(--primary-dark);
    color:#F2EFE7;
    padding:22px 14px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .nav-brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 8px 22px;
    margin-bottom:10px;
    border-bottom:1px solid rgba(242,239,231,.14);
  }
  .nav-brand .mark{
    width:34px;height:34px;border-radius:7px;
    background:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:var(--primary-dark);font-size:16px;
    flex-shrink:0;
  }
  .nav-brand .txt{ font-weight:700; font-size:15px; line-height:1.3; }
  .nav-brand .txt small{ display:block; font-weight:400; font-size:11.5px; color:#C7D6CF; margin-top:2px;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px;
    border-radius:var(--radius-sm);
    color:#DCE7E1;
    font-size:14px;
    text-align:right;
    transition:background .12s;
  }
  .nav-item .ic{ width:18px; height:18px; display:flex; align-items:center; justify-content:center; opacity:.9; flex-shrink:0; }
  .nav-item .ic svg{ width:18px; height:18px; }
  .nav-item:hover{ background:rgba(242,239,231,.08); }
  .nav-item.active{ background:var(--gold); color:var(--primary-dark); font-weight:700; }
  .nav-foot{
    margin-top:auto; padding:10px 8px 0; font-size:11.5px; color:#93A69D;
    border-top:1px solid rgba(242,239,231,.12); padding-top:14px;
  }

  .main{ min-width:0; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; padding-top:calc(18px + env(safe-area-inset-top, 0px));
    border-bottom:1px solid var(--border);
    background:var(--surface);
    flex-wrap:wrap; gap:10px;
  }
  .topbar h1{ font-size:19px; }
  .topbar .sub{ color:var(--ink-soft); font-size:13px; margin-top:2px; }
  .topbar-right{ display:flex; align-items:center; gap:8px; }
  .class-select{
    padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--paper); font-weight:600; font-size:13.5px; min-width:140px;
  }
  .content{ padding:24px 28px 60px; max-width:1080px; }

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:9px 16px; border-radius:var(--radius-sm);
    font-size:13.5px; font-weight:600;
    background:var(--surface); border:1px solid var(--border); color:var(--ink);
  }
  .btn:hover{ border-color:var(--ink-faint); }
  .btn.primary{ background:var(--primary); border-color:var(--primary); color:#fff; }
  .btn.primary:hover{ background:var(--primary-dark); }
  .btn.gold{ background:var(--gold); border-color:var(--gold); color:var(--primary-dark); }
  .btn.success{ background:var(--present); border-color:var(--present); color:#fff; }
  .btn.danger{ color:var(--absent); border-color:var(--absent); background:transparent; }
  .btn.ghost{ border-color:transparent; background:transparent; }
  .btn.sm{ padding:6px 11px; font-size:12.5px; }
  .btn svg{ width:14px; height:14px; flex-shrink:0; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .icon-btn{
    width:36px; height:36px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;
  }
  .icon-btn:hover{ border-color:var(--ink-faint); }

  /* ---------- ruled panel (notebook motif) ---------- */
  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    margin-bottom:18px;
    overflow:hidden;
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px; border-bottom:1px solid var(--border);
    gap:10px; flex-wrap:wrap;
  }
  .panel-head h3{ font-size:15px; }
  .panel-head .hint{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .panel-body{ padding:18px; }

  /* tab-divider style secondary nav (used inside pages, e.g. subject tabs) */
  .tabs{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .tab{
    padding:8px 16px; border-radius:8px 8px 0 0; font-size:13.5px; font-weight:600;
    background:var(--paper-line); color:var(--ink-soft); border:1px solid var(--border); border-bottom:none;
    display:flex; align-items:center; gap:8px;
  }
  .tab.active{ background:var(--surface); color:var(--ink); }
  .tab .edit-ic{ font-size:11px; opacity:.6; }
  .tab .edit-ic:hover{ opacity:1; }

  /* ---------- KPI strip ---------- */
  .kpi-strip{
    display:grid; grid-template-columns:repeat(3,1fr);
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    margin-bottom:18px; overflow:hidden;
  }
  .kpi{ padding:16px 18px; border-inline-start:1px solid var(--border); }
  .kpi:first-child{ border-inline-start:none; }
  .kpi .num{ font-size:26px; font-weight:700; line-height:1; }
  .kpi .lbl{ font-size:12.5px; color:var(--ink-soft); margin-top:8px; }
  .kpi.present .num{ color:var(--present); }
  .kpi.absent .num{ color:var(--absent); }
  .kpi.gold .num{ color:var(--gold); }

  /* ---------- tables ---------- */
  .table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table{ width:100%; min-width:520px; border-collapse:collapse; font-size:13.5px; }
  thead th{ background:var(--paper); border:1px solid var(--border); padding:11px 10px; text-align:right; font-weight:700; color:var(--ink); font-size:12.5px; }
  tbody td{ border:1px solid var(--border); padding:9px 10px; text-align:right; }
  tbody tr:nth-child(even){ background:#FBFAF6; }
  tbody tr:hover{ background:var(--primary-tint); }
  .num-badge{ display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; background:var(--paper-line); color:var(--ink-soft); font-size:11.5px; font-weight:700; }
  .name-cell{ display:flex; align-items:center; gap:10px; }
  .avatar{ width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; color:#fff; flex-shrink:0; }
  td input[type=number]{
    width:56px; padding:5px 6px; border:1px solid var(--border); border-radius:5px; text-align:center;
  }
  td select{ padding:5px 6px; border:1px solid var(--border); border-radius:5px; }

  /* ---------- attendance / assignment chips (table-style list) ---------- */
  .att-table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:8px; }
  .att-table{ border:1px solid var(--border); border-radius:8px; overflow:hidden; min-width:540px; }
  .att-thead{ display:flex; background:var(--paper); }
  .att-thead > div{ padding:10px 14px; font-size:12px; font-weight:700; color:var(--ink); }
  .att-thead .th-num{ width:52px; flex-shrink:0; text-align:center; padding-inline:0; border-inline-end:1px solid var(--border); }
  .att-thead .th-name{ flex:1; border-inline-end:1px solid var(--border); }
  .att-thead .th-status{ min-width:260px; }
  .th-status-grid{ display:grid; grid-template-columns:repeat(4,1fr); min-width:260px; padding:0; }
  .th-status-grid span{ text-align:center; border-inline-end:1px solid var(--border); padding:10px 4px; }
  .th-status-grid span:last-child{ border-inline-end:none; }
  .att-row{ display:flex; align-items:stretch; border-bottom:1px solid var(--border); gap:0; }
  .att-row:last-child{ border-bottom:none; }
  .att-row:nth-child(even){ background:#FBFAF6; }
  .att-num-col{ width:52px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-inline-end:1px solid var(--border); }
  .att-name{ display:flex; align-items:center; gap:10px; font-weight:600; font-size:14px; flex:1; padding:11px 14px; border-inline-end:1px solid var(--border); }
  .att-num{ width:24px; height:24px; border-radius:50%; background:var(--paper-line); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; flex-shrink:0; }
  .att-choices{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; min-width:260px; padding:9px 14px; }
  .att-choices-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:0; align-items:stretch; min-width:260px; padding:0; }
  .att-choices-grid.cols-3{ grid-template-columns:repeat(3, 1fr); }
  .att-choices-grid .chip{ border-radius:0; border:none; border-inline-end:1px solid var(--border); padding:11px 4px; margin:0; width:100%; text-align:center; }
  .att-choices-grid .chip:last-child{ border-inline-end:none; }
  .chip{
    padding:6px 12px; border-radius:20px; font-size:12.5px; font-weight:600;
    border:1px solid var(--border); background:var(--paper); color:var(--ink-soft);
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
  }
  .chip svg{ width:15px; height:15px; flex-shrink:0; }
  .chip-badge{ display:inline-flex; }
  .chip.present.on{ background:var(--present-tint); border-color:var(--present); color:var(--present); }
  .chip.absent.on{ background:var(--absent-tint); border-color:var(--absent); color:var(--absent); }
  .chip.late.on{ background:var(--late-tint); border-color:var(--late); color:var(--late); }
  .chip.excused.on{ background:var(--excused-tint); border-color:var(--excused); color:var(--excused); }
  .chip.done.on{ background:var(--present-tint); border-color:var(--present); color:var(--present); }
  .chip.missing.on{ background:var(--absent-tint); border-color:var(--absent); color:var(--absent); }

  /* ---------- forms ---------- */
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; font-weight:600; }
  .field input[type=text], .field input[type=number], .field select, .field textarea, .field input[type=file]{
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--paper);
  }
  .field textarea{ min-height:100px; resize:vertical; font-family:inherit; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .form-actions{ display:flex; gap:10px; margin-top:16px; }

  /* ---------- empty state ---------- */
  .empty{ text-align:center; padding:44px 20px; color:var(--ink-soft); }
  .empty .mark{ font-size:30px; margin-bottom:10px; }
  .empty p{ max-width:360px; margin:6px auto 0; font-size:13.5px; }

  /* ---------- modal ---------- */
  .modal-bg{ position:fixed; inset:0; background:rgba(35,48,58,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }

  /* ---------- License Gate ---------- */
  .license-gate{
    position:fixed; inset:0; z-index:500; background:var(--primary-dark);
    display:flex; align-items:center; justify-content:center;
    padding:24px; padding-top:calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
    overflow-y:auto;
  }
  .license-card{
    background:var(--surface); border-radius:var(--radius); padding:32px 26px;
    width:100%; max-width:360px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.3);
  }
  .license-logo{
    width:56px; height:56px; border-radius:14px; background:var(--primary-dark);
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px;
  }
  .license-logo svg{ width:28px; height:28px; }
  .license-card h2{ font-size:18px; margin-bottom:6px; }
  .license-sub{ font-size:13px; color:var(--ink-soft); margin-bottom:18px; line-height:1.8; }
  .license-card .field label{ font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; display:block; }
  .license-card .field input{ text-align:center; letter-spacing:1px; }
  .license-error{
    background:var(--absent-tint); color:var(--absent); border-radius:var(--radius-sm);
    padding:9px 12px; font-size:12.5px; margin-bottom:12px; line-height:1.7;
  }
  .license-note{ font-size:11px; color:var(--ink-faint); margin-top:14px; line-height:1.8; }
  .license-card .btn:disabled{ opacity:.6; cursor:default; }

  .modal{ background:var(--surface); border-radius:var(--radius); width:100%; max-width:440px; max-height:90vh; overflow:auto; }
  .modal-head{ padding:16px 18px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  .modal-body{ padding:18px; }

  /* ---------- toast ---------- */
  .toast{ position:fixed; bottom:calc(22px + env(safe-area-inset-bottom, 0px)); right:50%; transform:translateX(50%); background:var(--primary-dark); color:#fff;
    padding:11px 20px; border-radius:8px; font-size:13.5px; z-index:60; box-shadow:0 4px 14px rgba(0,0,0,.2); }

  /* ---------- bar chart (custom, no library) ---------- */
  .bars-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .bars{ display:flex; align-items:flex-end; justify-content:center; gap:10px; height:140px; padding:8px 4px 0; min-width:min-content; }
  .bar-col{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; flex:0 0 auto; padding:0 4px; }
  .bar-value{ font-size:11px; color:var(--ink-soft); font-weight:700; }
  .bar{ width:26px; border-radius:5px 5px 0 0; transition:height .15s; }
  .chart-legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-soft); margin-top:14px; padding-top:12px; border-top:1px solid var(--border); }
  .chart-legend .li{ display:flex; align-items:center; gap:6px; }
  .chart-legend .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .bar-col .lbl{ font-size:10px; color:var(--ink-soft); text-align:center; line-height:1.3; }

  /* ---------- donut chart (custom, conic-gradient) ---------- */
  .donut-wrap{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .donut{ width:130px; height:130px; border-radius:50%; position:relative; flex-shrink:0; }
  .donut-hole{ position:absolute; inset:18px; background:var(--surface); border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .donut-hole .pct{ font-size:21px; font-weight:700; color:var(--primary); line-height:1.1; }
  .donut-hole .lbl{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; }
  .legend{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; }
  .legend .li{ display:flex; align-items:center; gap:8px; }
  .legend .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }

  .badge{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:600; }

  .students-toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .students-toolbar input{ flex:1; min-width:160px; padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--paper); }
  .search-box{ position:relative; flex:1; min-width:180px; }
  .search-box .search-ic{ position:absolute; inset-inline-start:12px; top:50%; transform:translateY(-50%); color:var(--ink-faint); display:flex; pointer-events:none; }
  .search-box .search-ic svg{ width:15px; height:15px; }
  .search-box input{ width:100%; padding:9px 36px 9px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--paper); font-size:13px; }
  .search-box input:focus{ outline:none; border-color:var(--primary); }

  /* ---------- assignments ---------- */
  .assign-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border-bottom:1px solid var(--border); gap:12px; cursor:pointer; }
  .assign-row:nth-child(even){ background:#FBFAF6; }
  .assign-row:last-child{ border-bottom:none; }
  .assign-row:hover{ background:var(--primary-tint); }
  .assign-thead{ display:flex; justify-content:space-between; background:var(--paper); padding:10px 16px; font-size:12px; font-weight:700; color:var(--ink); border-bottom:1px solid var(--border); }
  .assign-title{ font-weight:600; font-size:14px; margin-top:6px; }
  .assign-meta{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
  .assign-substats{ font-size:11px; color:var(--ink-faint); margin-top:3px; }
  .assign-overdue{ color:var(--absent); font-weight:700; }
  .assign-progress{ width:64px; height:7px; background:var(--paper-line); border-radius:4px; overflow:hidden; flex-shrink:0; }
  .assign-progress > div{ height:100%; }
  .assign-pct{ font-size:12px; font-weight:700; width:34px; flex-shrink:0; }
  .type-badge{ padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
  .type-badge.hw{ background:var(--gold-tint); color:var(--gold); }
  .type-badge.activity{ background:var(--primary-tint); color:var(--primary); }

  .pick-result{ text-align:center; padding:16px 10px; }
  .pick-result .name{ font-size:24px; font-weight:700; color:var(--primary); margin-top:10px; }

  .footer-note{ font-size:12px; color:var(--ink-faint); text-align:center; margin-top:26px; }

  /* ---------- print report header ---------- */
  .print-header{ padding:4px 0 16px; margin-bottom:16px; border-bottom:2px solid var(--primary-dark); text-align:center; }
  .print-header .logo-row{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .print-header .logo-img{ width:52px; height:52px; border-radius:10px; object-fit:cover; flex-shrink:0; }
  .print-header .head-txt{ text-align:center; }
  .print-header .school{ font-size:17px; font-weight:700; }
  .print-header .report-title{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .print-header .student-name{ font-size:21px; font-weight:800; color:var(--ink); margin-top:10px; }
  .print-header .meta-line{ font-size:12.5px; color:var(--ink-soft); margin-top:5px; }

  /* ---------- analysis box ---------- */
  .analysis-box{ background:var(--paper); border-radius:var(--radius-sm); padding:14px 16px; margin-top:14px; }
  .analysis-box .row{ display:flex; align-items:center; gap:8px; font-size:13px; margin-top:7px; }
  .analysis-box .row:first-child{ margin-top:0; }
  .analysis-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }

  /* ---------- student profile ---------- */
  .profile-cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
  .pcard{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; text-align:center; }
  .pcard-ic{ font-size:20px; margin-bottom:6px; }
  .pcard-val{ font-size:19px; font-weight:700; }
  .pcard-lbl{ font-size:11.5px; color:var(--ink-soft); margin-top:5px; }
  .flag-row{ display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
  .flag-row:last-child{ border-bottom:none; }
  .flag-ic{ font-size:17px; flex-shrink:0; }
  .note-item{ background:var(--paper); border-radius:var(--radius-sm); padding:11px 14px; margin-bottom:8px; position:relative; }
  .note-date{ font-size:11px; color:var(--ink-faint); }
  .note-text{ font-size:13.5px; margin-top:4px; padding-inline-end:60px; }
  .note-item .btn{ position:absolute; top:9px; left:10px; }
  .obs-tags{ display:flex; flex-wrap:wrap; gap:8px; }
  .obs-tag{ padding:8px 14px; border-radius:20px; font-size:13px; font-weight:600; border:1px solid var(--border); background:var(--paper); color:var(--ink-soft); }
  .obs-tag.on{ background:var(--primary-tint); border-color:var(--primary); color:var(--primary); }
  .attention-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border); gap:12px; cursor:pointer; flex-wrap:wrap; }
  .attention-row:last-child{ border-bottom:none; }
  .attention-row:nth-child(even){ background:#FBFAF6; }
  .attention-row:hover{ background:var(--primary-tint); }
  .attention-tags{ display:flex; flex-wrap:wrap; gap:6px; }
  .mini-flag{ font-size:11.5px; font-weight:600; background:var(--gold-tint); color:var(--gold); padding:4px 10px; border-radius:20px; white-space:nowrap; }

  /* ---------- row action icon buttons (students/grades tables) ---------- */
  .row-actions{ display:flex; align-items:center; gap:6px; justify-content:flex-end; }
  .icon-btn{
    width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--border); background:var(--surface); cursor:pointer; transition:filter .15s, transform .1s;
  }
  .icon-btn svg{ width:15px; height:15px; }
  .icon-btn:active{ transform:scale(.94); }
  .icon-btn.gold{ background:var(--gold-tint); border-color:transparent; color:var(--gold); }
  .icon-btn.ghost{ color:var(--ink-soft); }
  .icon-btn.ghost:hover{ background:var(--paper-line); }
  .icon-btn.danger{ background:var(--absent-tint); border-color:transparent; color:var(--absent); }
  .icon-btn.danger:hover{ filter:brightness(0.93); }

  /* ---------- date picker (simple, reliable native selects) ---------- */
  .date-select-row{ display:grid; grid-template-columns:1fr 1.5fr 1fr; gap:8px; }

  .pagination{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:14px 16px; border-top:1px solid var(--border); }
  .pg-status{ font-size:12px; color:var(--ink-soft); }
  .pg-controls{ display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .pg-btn, .pg-nav{ min-width:30px; height:30px; padding:0 8px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:12.5px; cursor:pointer; }
  .pg-btn.active{ background:var(--primary); color:#fff; border-color:var(--primary); font-weight:700; }
  .pg-nav:disabled{ opacity:.4; cursor:default; }
  .pg-ellipsis{ padding:0 4px; color:var(--ink-faint); font-size:12px; }
  @media (max-width:640px){
    .pagination{ flex-direction:column; align-items:stretch; text-align:center; }
    .pg-controls{ justify-content:center; }
  }


  .school-profile-card{ display:flex; align-items:center; gap:16px; }
  .logo-upload-area{ width:72px; height:72px; border-radius:14px; border:1.5px dashed var(--border); background:var(--paper-line); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; }
  .logo-placeholder{ font-size:28px; opacity:.5; }
  .logo-preview{ width:100%; height:100%; object-fit:cover; }
  .logo-info{ flex:1; }
  .logo-title{ font-size:13px; font-weight:700; color:var(--ink); margin-bottom:6px; }
  .logo-actions{ display:flex; gap:8px; flex-wrap:wrap; }


  .brand-footer{
    background:transparent; border-top:1px solid var(--border); padding:16px 4px 4px;
    display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:6px;
  }
  .footer-heading{ font-size:12.5px; font-weight:700; color:var(--ink-soft); }
  .footer-links{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; justify-content:center; }
  .footer-links a.social-line{ text-decoration:none; }
  .footer-links a.social-line:hover{ color:var(--primary); }
  .footer-links a.social-line:hover .social-ic{ color:var(--primary); }
  .footer-legal{ font-size:10.5px; color:var(--ink-faint); text-align:center; line-height:1.8; max-width:560px; margin-top:2px; }
  .social-line{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft); }
  .social-ic{ display:flex; align-items:center; justify-content:center; width:16px; height:16px; color:var(--ink-soft); flex-shrink:0; }
  .social-ic svg{ width:14px; height:14px; }
  .social-handle{ font-size:12px; color:var(--ink-soft); font-weight:600; direction:ltr; }
  .report-footer{ display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; margin-top:14px; padding-top:8px; border-top:1px solid var(--border); font-size:10.5px; color:var(--ink-faint); }
  .report-footer .social-line{ font-size:10.5px; }
  .report-footer .social-ic{ width:12px; height:12px; }
  .report-footer .social-ic svg{ width:11px; height:11px; }

  /* mobile */
  @media (max-width:820px){
    .app{ grid-template-columns:1fr; }
    .nav{
      position:fixed; bottom:0; right:0; left:0; z-index:40;
      flex-direction:row; padding:6px 6px; padding-bottom:calc(6px + env(safe-area-inset-bottom, 0px)); gap:2px; overflow-x:auto;
      border-top:1px solid rgba(0,0,0,.15);
    }
    .nav-brand, .nav-foot{ display:none; }
    .nav-item{ flex-direction:column; gap:3px; font-size:10px; padding:7px 9px; white-space:nowrap; position:relative; min-height:44px; justify-content:center; }
    .nav-item .ic{ width:20px; height:20px; }
    .nav-item .ic svg{ width:20px; height:20px; }
    .nav-item.active{ background:transparent; color:var(--gold); font-weight:700; }
    .nav-item.active::after{
      content:''; position:absolute; top:2px; right:50%; transform:translateX(50%);
      width:4px; height:4px; border-radius:50%; background:var(--gold);
    }
    .main{ padding-bottom:calc(74px + env(safe-area-inset-bottom, 0px)); }
    .toast{ bottom:calc(84px + env(safe-area-inset-bottom, 0px)); }
    .content{ padding:18px 14px 40px; }
    .topbar{ padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top, 0px)); }
    .row2{ grid-template-columns:1fr; }
    .profile-cards{ grid-template-columns:repeat(2,1fr); }
    .note-text{ padding-inline-end:0; margin-top:8px; }
    .note-item .btn{ position:static; margin-top:8px; }
  }

  /* print */
  @media print{
    .nav, .topbar, .no-print{ display:none !important; }
    .app{ display:block; }
    .content{ padding:0; max-width:none; }
    body{ background:#fff; font-size:12px; }
    .panel{ border:none; }
    @page{ margin:12mm; size:A4; }
    .print-hide{ display:none !important; }
    .report-print .panel-body{ padding:0; }
    .print-header{ padding:0 0 10px; margin-bottom:12px; }
    .print-header .logo-img{ width:34px; height:34px; }
    .print-header .school{ font-size:14px; }
    .print-header .student-name{ font-size:17px; margin-top:5px; }
    .print-header .meta-line{ font-size:11px; margin-top:3px; }
    .donut{ width:96px; height:96px; }
    .donut-hole{ inset:14px; }
    .donut-hole .pct{ font-size:17px; }
    .donut-wrap{ gap:16px; }
    table{ font-size:11px; min-width:0; }
    thead th, tbody td{ padding:5px 7px; }
    h4{ margin-top:12px !important; margin-bottom:6px !important; font-size:12.5px !important; }
    tr{ page-break-inside:avoid; }
  }
</style>
</head>

    <button class="nav-item" data-view="assignments"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M8 9.5l1.8 1.8L13.5 7.5"/><path d="M8 16h8"/></svg></span> تکالیف و فعالیت‌ها</button>

    <button class="nav-item" data-view="settings"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.7v3.1M12 18.2v3.1M21.3 12h-3.1M5.8 12h-3.1M18.3 5.7l-2.2 2.2M7.9 16.1l-2.2 2.2M18.3 18.3l-2.2-2.2M7.9 7.9 5.7 5.7"/></svg></span> تنظیمات</button>
    <div class="nav-foot">تمام اطلاعات فقط روی همین دستگاه ذخیره می‌شود.</div>

  <div class="main">

  d = d - div(div(gy+100100+div(gm-8,6),100)*3,4) + 752;
  return d;
}
function d2g(jdn){
  let j = 4*jdn + 139361631;
  j = j + div(div(4*jdn+183187720,146097)*3,4)*4 - 3908;
  const i = div(mod(j,1461),4)*5 + 308;
  const gd = div(mod(i,153),5) + 1;
  const gm = mod(div(i,153),12) + 1;
  const gy = div(j,1461) - 100100 + div(8-gm,6);
  return {gy:gy, gm:gm, gd:gd};
}
function j2d(jy,jm,jd){
  const r = jalCal(jy);
  return g2d(r.gy,3,r.march) + (jm-1)*31 - div(jm,7)*(jm-7) + jd - 1;
}
function d2j(jdn){
  const gy = d2g(jdn).gy; let jy = gy - 621;
  const r = jalCal(jy); const jdn1f = g2d(gy,3,r.march);
  let jd, jm, k = jdn - jdn1f;
  if(k >= 0){
    if(k <= 185){ jm = 1 + div(k,31); jd = mod(k,31) + 1; return {jy:jy,jm:jm,jd:jd}; }
    else{ k -= 186; }
  } else {
    jy -= 1; k += 179;
    if(r.leap === 1) k += 1;
  }
  jm = 7 + div(k,30); jd = mod(k,30) + 1;
  return {jy:jy,jm:jm,jd:jd};
}
function toJalaali(gy,gm,gd){ return d2j(g2d(gy,gm,gd)); }
function toGregorian(jy,jm,jd){ return d2g(j2d(jy,jm,jd)); }

const J_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const J_WEEKDAYS = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];

function todayJalali(){ const t = new Date(); return toJalaali(t.getFullYear(), t.getMonth()+1, t.getDate()); }
function todayJalaliKey(){ const j = todayJalali(); return j.jy+'-'+j.jm+'-'+j.jd; }
function jalaaliKeyToLabel(key){
  const [jy,jm,jd] = key.split('-').map(Number);
  return jd+' '+J_MONTHS[jm-1]+' '+jy;
}
function j2dFromKey(key){ const [jy,jm,jd] = key.split('-').map(Number); return j2d(jy,jm,jd); }
const J_WEEKDAYS_SHORT = ['ی','د','س','چ','پ','ج','ش'];
function weekdayOfKey(key){
  const [jy,jm,jd] = key.split('-').map(Number);
  const g = toGregorian(jy,jm,jd);
  return J_WEEKDAYS[new Date(g.gy, g.gm-1, g.gd).getDay()];
}
function weekdayShortOfKey(key){
  const [jy,jm,jd] = key.split('-').map(Number);
  const g = toGregorian(jy,jm,jd);
  return J_WEEKDAYS_SHORT[new Date(g.gy, g.gm-1, g.gd).getDay()];
}
function lastWeekKeys(){
  const t = todayJalaliKey();
  const keys = [];
  for(let i=6;i>=0;i--) keys.push(shiftJalaliKey(t, -i));
  return keys;
}
function shiftJalaliKey(key, deltaDays){
  const [jy,jm,jd] = key.split('-').map(Number);
  const jdn = j2d(jy,jm,jd) + deltaDays;
  const j = d2j(jdn);
  return j.jy+'-'+j.jm+'-'+j.jd;
}

function formatBackupTimestamp(ms){
  if(!ms) return null;
  const d = new Date(ms);
  const j = toJalaali(d.getFullYear(), d.getMonth()+1, d.getDate());
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${j.jy}/${String(j.jm).padStart(2,'0')}/${String(j.jd).padStart(2,'0')} ساعت ${hh}:${mm}`;
}

/* =======================================================================
   License Gate — فعال‌سازی و اعتبارسنجی آنلاین، با پشتیبانی از استفاده آفلاین
   (کاملاً مستقل از DATA برنامه؛ در کلید جداگانه‌ای در localStorage ذخیره می‌شود
   تا نه با Backup/Restore و نه با «حذف کامل اطلاعات» دست‌خورده نشود)
======================================================================= */
const LICENSE_API = 'https://daftaryar-license.get-aihubtools.workers.dev';
const LICENSE_KEY = 'daftaryar_license_v1';
const DEVICE_ID_KEY = 'daftaryar_device_id_v1';

function getOrCreateDeviceId(){
  try{
    let id = localStorage.getItem(DEVICE_ID_KEY);
    if(id) return id;
    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
      : 'dev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
    localStorage.setItem(DEVICE_ID_KEY, id);
    return id;
  }catch(e){
    return 'dev-fallback-' + Math.random().toString(36).slice(2, 12);
  }
}
function getStoredLicense(){
  try{
    const raw = localStorage.getItem(LICENSE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveStoredLicense(lic){
  try{ localStorage.setItem(LICENSE_KEY, JSON.stringify(lic)); }catch(e){}
}
function clearStoredLicense(){
  try{ localStorage.removeItem(LICENSE_KEY); }catch(e){}
}
async function licenseApiCall(action, code, deviceId){
  let res;
  try{
    res = await fetch(LICENSE_API, {
      method: 'POST',
      mode: 'cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action, code, deviceId})
    });
  }catch(networkErr){
    /* fetch فقط زمانی throw می‌کند که اصلاً درخواست به مقصد نرسیده باشد —
       رایج‌ترین علت‌ها: قطعی اینترنت، یا مسدود شدن توسط CORS (که مرورگر برای امنیت
       جزئیات آن را پنهان می‌کند، اما پیام خطا معمولاً شامل «Failed to fetch» است). */
    return { networkError: true, errorDetail: (networkErr && networkErr.message) ? networkErr.message : String(networkErr) };
  }
  let rawText = '';
  try{ rawText = await res.text(); }catch(e){ /* بدنه پاسخ خوانده نشد */ }
  let data = null;
  if(rawText){
    try{ data = JSON.parse(rawText); }catch(e){ /* پاسخ JSON معتبر نبود */ }
  }
  return { httpOk: res.ok, status: res.status, data, rawText };
}
function licenseCallSucceeded(result){
  if(!result || result.networkError || !result.httpOk || !result.data) return false;
  const d = result.data;
  return d.success === true || d.valid === true || d.status === 'ok' || d.status === 'active' || d.status === 'success';
}
function licenseErrorText(result){
  if(!result) return 'خطای نامشخص در ارتباط با سرور فعال‌سازی.';
  if(result.networkError){
    return 'ارتباط با سرور فعال‌سازی برقرار نشد (خطای شبکه یا CORS): ' + (result.errorDetail || 'نامشخص');
  }
  if(result.data && (result.data.message || result.data.error)){
    return result.data.message || result.data.error;
  }
  if(!result.httpOk){
    return 'سرور فعال‌سازی خطای HTTP ' + result.status + ' برگرداند' + (result.rawText ? ('؛ پاسخ: ' + result.rawText.slice(0,200)) : '.');
  }
  if(!result.data){
    return 'پاسخ سرور در قالب مورد انتظار نبود' + (result.rawText ? ('؛ پاسخ خام: ' + result.rawText.slice(0,200)) : '.');
  }
  return 'کد فعال‌سازی تأیید نشد.';
}

function showLicenseGate(){
  const gate = document.getElementById('licenseGate');
  const app = document.querySelector('.app');
  if(app) app.style.display = 'none';
  gate.style.display = 'flex';
  const stored = getStoredLicense();
  if(stored && stored.code){
    document.getElementById('licenseCodeInput').value = stored.code;
  }
}
function hideLicenseGate(){
  const gate = document.getElementById('licenseGate');
  const app = document.querySelector('.app');
  gate.style.display = 'none';
  if(app) app.style.display = '';
}
function setLicenseGateError(msg){
  const box = document.getElementById('licenseError');
  if(!msg){ box.style.display = 'none'; box.textContent = ''; return; }
  box.textContent = msg;
  box.style.display = 'block';
}
function setLicenseGateLoading(loading){
  const btn = document.getElementById('licenseActivateBtn');
  const input = document.getElementById('licenseCodeInput');
  btn.disabled = loading;
  input.disabled = loading;
  btn.textContent = loading ? 'در حال بررسی…' : 'فعال‌سازی';
}
async function handleLicenseActivate(){
  const input = document.getElementById('licenseCodeInput');
  const code = input.value.trim();
  if(!code){ setLicenseGateError('کد فعال‌سازی را وارد کنید.'); return; }
  setLicenseGateError(null);
  setLicenseGateLoading(true);
  const deviceId = getOrCreateDeviceId();
  try{
    const actRes = await licenseApiCall('activate', code, deviceId);
    if(!licenseCallSucceeded(actRes)){
      setLicenseGateLoading(false);
      setLicenseGateError(licenseErrorText(actRes));
      return;
    }
    const valRes = await licenseApiCall('validate', code, deviceId);
    if(!licenseCallSucceeded(valRes)){
      setLicenseGateLoading(false);
      setLicenseGateError(licenseErrorText(valRes));
      return;
    }
    saveStoredLicense({ code, deviceId, valid: true, activatedAt: Date.now(), lastValidatedAt: Date.now() });
    setLicenseGateLoading(false);
    hideLicenseGate();
    render();
  }catch(e){
    setLicenseGateLoading(false);
    setLicenseGateError('خطای غیرمنتظره: ' + ((e && e.message) ? e.message : String(e)));
  }
}
/* بعد از ورود موفق، در پس‌زمینه و فقط در صورت اتصال، اعتبار را دوباره بررسی می‌کند.
   در حالت آفلاین هیچ کاری نمی‌کند تا استفاده آفلاین از برنامه مختل نشود. */
async function revalidateLicenseInBackground(code, deviceId){
  if(typeof navigator !== 'undefined' && navigator.onLine === false) return;
  try{
    const result = await licenseApiCall('validate', code, deviceId);
    if(licenseCallSucceeded(result)){
      const stored = getStoredLicense() || {};
      saveStoredLicense(Object.assign({}, stored, { code, deviceId, valid: true, lastValidatedAt: Date.now() }));
    } else if(result.httpOk){
      /* سرور صراحتاً پاسخ داده که نامعتبر است (نه یک خطای شبکه) — دسترسی قفل شود */
      saveStoredLicense({ code, deviceId, valid: false, lastValidatedAt: Date.now() });
      setLicenseGateError(licenseErrorText(result));
      showLicenseGate();
    }
  }catch(e){ /* خطای شبکه؛ نادیده گرفته می‌شود تا آفلاین همچنان کار کند */ }
}
function initLicenseGate(){
  document.getElementById('licenseActivateBtn').addEventListener('click', handleLicenseActivate);
  document.getElementById('licenseCodeInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') handleLicenseActivate();
  });
  const deviceId = getOrCreateDeviceId();
  const stored = getStoredLicense();
  if(!stored || !stored.code || stored.valid === false){
    showLicenseGate();
    return;
  }
  /* لایسنس معتبرِ ذخیره‌شده داریم — فوراً برنامه نمایش داده شود (تجربه آفلاین)،
     و اعتبار در پس‌زمینه دوباره بررسی شود. */
  render();
  revalidateLicenseInBackground(stored.code, deviceId);
}

/* =======================================================================
   پرونده دانش‌آموز — محاسبات قانون‌محور (بدون AI، فقط بر پایه داده‌های موجود)
======================================================================= */
function computeAttendanceStats(studentId){
  let present=0, absent=0, late=0, excused=0, total=0;
  Object.keys(DATA.attendance).forEach(k=>{
    const st = DATA.attendance[k][studentId];
    if(st){ total++; if(st==='present')present++; else if(st==='absent')absent++; else if(st==='late')late++; else excused++; }
  });
  const pct = total ? Math.round((present/total)*100) : 0;
  return {present, absent, late, excused, total, pct};
}
function computeAssignmentStats(studentId, classId){
  const list = DATA.assignments.filter(a=>a.classId===classId);
  const todayJdn = j2dFromKey(todayJalaliKey());
  let done=0, missing=0, overdue=[];
  list.forEach(a=>{
    const st = (DATA.assignmentStatus[a.id]||{})[studentId];
    if(st==='done') done++;
    else if(st==='missing') missing++;
    if(a.dueDateKey && j2dFromKey(a.dueDateKey)<todayJdn && st!=='done') overdue.push(a);
  });
  const total = list.length;
  const pct = total ? Math.round((done/total)*100) : 0;
  return {done, missing, total, pct, overdue};
}
/* روند نمره هر درس: میانگین نیمه اول تاریخچه ثبت‌شده با نیمه دوم مقایسه می‌شود.
   حداقل ۳ نمره ثبت‌شده لازم است؛ در غیر این‌صورت "داده کافی نیست" برمی‌گردد.
   این تاریخچه فقط از این نسخه به بعد جمع‌آوری می‌شود (نمرات قبلی که فقط یک مقدار بودند، تاریخچه ندارند). */
function computeSubjectTrend(studentId, subject){
  const hist = ((DATA.gradeHistory[studentId]||{})[subject]) || [];
  if(hist.length < 3) return {status:'insufficient', count:hist.length};
  const sorted = hist.slice().sort((a,b)=> j2dFromKey(a.dateKey)-j2dFromKey(b.dateKey));
  const half = Math.ceil(sorted.length/2);
  const firstHalf = sorted.slice(0, half);
  const secondHalf = sorted.slice(half);
  if(!secondHalf.length) return {status:'insufficient', count:hist.length};
  const avg = arr => arr.reduce((a,b)=>a+Number(b.value),0)/arr.length;
  const diff = avg(secondHalf) - avg(firstHalf);
  if(diff >= 1.5) return {status:'up', diff};
  if(diff <= -1.5) return {status:'down', diff};
  return {status:'flat', diff};
}
/* هشدارهای «نیازمند توجه» — همه بر پایه قواعد شفاف و قابل‌توضیح، بدون قضاوت */
function computeAttentionFlags(studentId, classId){
  const flags = [];
  const att = computeAttendanceStats(studentId);
  if(att.total>=3 && att.pct<75){
    flags.push({icon:'🕐', text:'حضور نامنظم', detail:`در ${att.total} جلسه ثبت‌شده، ${att.absent} غیبت دارد (${att.pct}٪ حضور).`});
  }
  const asg = computeAssignmentStats(studentId, classId);
  if(asg.total>=2 && asg.pct<50){
    flags.push({icon:'📝', text:'تکالیف ناقص', detail:`درصد انجام تکالیف این دانش‌آموز ${asg.pct}٪ است.`});
  }
  DATA.subjects.forEach(sub=>{
    const t = computeSubjectTrend(studentId, sub);
    if(t.status==='down'){
      flags.push({icon:'📉', text:`افت عملکرد در ${sub}`, detail:`میانگین اخیر این درس نسبت به قبل حدود ${Math.abs(Math.round(t.diff*10)/10)} نمره کاهش داشته.`});
    }
  });
  /* هشدار بر اساس آخرین آزمون ثبت‌شده برای این دانش‌آموز */
  const examRecs = studentExamRecords(studentId, classId);
  if(examRecs.length){
    const latest = examRecs[0];
    if(latest.pct < EXAM_ATTENTION_PCT){
      flags.push({icon:'📝', text:`نمره پایین در آزمون ${latest.exam.subject}`, detail:`در آزمون «${latest.exam.title}» نمره ${latest.score} از ${latest.exam.totalScore} (${latest.pct}٪) گرفته است.`});
    }
    const et = computeExamTrend(studentId, classId, latest.exam.subject);
    if(et.status==='down'){
      flags.push({icon:'📉', text:`افت در آزمون‌های ${latest.exam.subject}`, detail:`نمره آخرین آزمون نسبت به آزمون قبلی همان درس حدود ${Math.abs(et.diff)}٪ کاهش داشته.`});
    }
  }
  if(flags.length>=2){
    flags.push({icon:'🔎', text:'نیازمند بررسی بیشتر', detail:'چند شاخص هم‌زمان وضعیت ضعیف نشان می‌دهند.'});
  }
  return flags;
}
function studentSummaryText(studentId, classId){
  const att = computeAttendanceStats(studentId);
  const asg = computeAssignmentStats(studentId, classId);
  const parts = [];
  parts.push(att.total ? (att.pct>=90?'حضور منظم است.':(att.pct>=75?'حضور نسبتاً منظم است.':'غیبت‌های قابل‌توجهی ثبت شده است.')) : 'هنوز حضوری ثبت نشده.');
  if(asg.total){
    parts.push(asg.pct>=70?'انجام تکالیف مناسب است.':(asg.pct>=40?'انجام تکالیف متوسط است.':'انجام تکالیف ضعیف است.'));
  }
  const declining = DATA.subjects.filter(sub=>computeSubjectTrend(studentId, sub).status==='down');
  if(declining.length){
    parts.push(`در ${declining.join('، ')} روند کاهشی مشاهده شده و بهتر است عملکرد این درس در جلسات بعد بررسی شود.`);
  } else {
    parts.push('عملکرد کلی پایدار است و داده‌ای برای هشدار جدی مشاهده نشد.');
  }
  return parts.join(' ');
}
function suggestedAction(studentId, classId){
  const flags = computeAttentionFlags(studentId, classId);
  if(!flags.length) return null;
  const declining = flags.find(f=>f.text.startsWith('افت'));
  if(declining) return `پیشنهاد می‌شود عملکرد دانش‌آموز در ${declining.text.replace('افت عملکرد در ','')} در فعالیت‌های بعدی بررسی شود.`;
  const hw = flags.find(f=>f.text==='تکالیف ناقص');
  if(hw) return 'پیشنهاد می‌شود وضعیت تکالیف دانش‌آموز در روزهای آینده پیگیری شود.';
  const att = flags.find(f=>f.text==='حضور نامنظم');
  if(att) return 'در صورت تداوم غیبت، بهتر است موضوع پیگیری شود.';
  return 'پیشنهاد می‌شود وضعیت کلی دانش‌آموز بررسی شود.';
}

/* ---------- charts (no external library) ---------- */
function barChartHTML(items, opts){
  opts = opts || {};
  const defaultColor = opts.color || 'var(--primary)';
  const suffix = opts.suffix || '';
  if(!items.length) return '';
  const cols = items.map(it=>{
    const pct = it.max ? Math.max(4, Math.round((it.value/it.max)*100)) : 4;
    const color = it.color || defaultColor;
    const valText = it.displayText != null ? it.displayText : `${esc(it.value)}${suffix}`;
    return `<div class="bar-col">
      <div class="bar-value" style="color:${color}">${valText}</div>
      <div class="bar" style="height:${pct}%;background:${color}"></div>
      <div class="lbl">${esc(it.label)}</div>
    </div>`;
  }).join('');
  const legend = opts.legend ? `<div class="chart-legend">${opts.legend.map(l=>
    `<div class="li"><span class="dot" style="background:${l.color}"></span>${esc(l.label)}</div>`).join('')}</div>` : '';
  return `<div class="bars-wrap"><div class="bars">${cols}</div></div>${legend}`;
}

function donutHTML(segments, centerPct, centerLabel){
  const total = segments.reduce((a,s)=>a+s.value,0);
  let stops;
  if(!total){
    stops = 'var(--paper-line) 0deg 360deg';
  } else {
    let acc = 0;
    stops = segments.map(s=>{
      const start = acc/total*360; acc += s.value; const end = acc/total*360;
      return `${s.color} ${start}deg ${end}deg`;
    }).join(', ');
  }
  return `<div class="donut" style="background:conic-gradient(${stops})">
    <div class="donut-hole"><div class="pct">${esc(centerPct)}</div><div class="lbl">${esc(centerLabel)}</div></div>
  </div>`;
}

/* =======================================================================

======================================================================= */
let studentsPage = 1, gradesPage = 1, attendancePage = 1, dashAttentionPage = 1, assignmentsListPage = 1, assignDetailPage = 1, examAttentionPage = 1;
function pageSize(){ return 10; }
function paginate(list, page, customSize){
  const size = customSize || pageSize();
  const totalPages = Math.max(1, Math.ceil(list.length / size));
  const p = Math.min(Math.max(1, page), totalPages);
  const start = (p-1)*size;
  return { items: list.slice(start, start+size), page: p, totalPages, size, start, total: list.length };
}
function paginationBarHtml(pg, gotoFn, itemLabel){
  if(pg.totalPages<=1) return '';
  const nums = Array.from(new Set([1, pg.totalPages, pg.page-1, pg.page, pg.page+1])).filter(n=>n>=1 && n<=pg.totalPages).sort((a,b)=>a-b);
  let btns = '', prev = 0;
  nums.forEach(n=>{
    if(prev && n-prev>1) btns += `<span class="pg-ellipsis">…</span>`;
    btns += `<button class="pg-btn ${n===pg.page?'active':''}" onclick="${gotoFn}(${n})">${n}</button>`;
    prev = n;
  });
  const from = pg.total ? pg.start+1 : 0;
  const to = Math.min(pg.start+pg.size, pg.total);
  return `<div class="pagination no-print">
    <div class="pg-status">${from}–${to} از ${pg.total} ${esc(itemLabel)}</div>
    <div class="pg-controls">
      <button class="pg-nav" ${pg.page<=1?'disabled':''} onclick="${gotoFn}(${pg.page-1})">‹ قبلی</button>
      ${btns}
      <button class="pg-nav" ${pg.page>=pg.totalPages?'disabled':''} onclick="${gotoFn}(${pg.page+1})">بعدی ›</button>
    </div>
  </div>`;
}

/* ---------- افزودن از اکسل/CSV یا متن ---------- */
function parseImportedRows(aoa){
  if(!aoa || !aoa.length) return [];
  let rows = aoa.map(r => (r||[]).map(c => c==null ? '' : String(c).trim()));
  const headerKeywords = ['نام','ردیف','شماره','کد ملی','پدر','ولی','تلفن'];
  const looksHeader = rows[0].some(c => headerKeywords.some(k=>c.includes(k)));
  let idxFirst=-1, idxLast=-1, idxFull=-1, idxNum=-1, idxNid=-1, idxFather=-1, idxPhone=-1;
  if(looksHeader){
    rows[0].forEach((h,i)=>{
      const isFull = h.includes('نام و نام خانوادگی') || h.includes('نام کامل') || h.includes('نام و نام');
      const isFather = h.includes('نام پدر') || h.includes('پدر');
      const isLastOnly = !isFull && !isFather && h.includes('نام خانوادگی');
      const isFirstOnly = !isFull && !isFather && !isLastOnly && h.includes('نام');
      if(isFull) idxFull = i;
      else if(isFather) idxFather = i;
      else if(isLastOnly) idxLast = i;
      else if(isFirstOnly) idxFirst = i;
      if(h.includes('کد ملی')) idxNid = i;
      else if(h.includes('شماره دانش') || (h.includes('شماره') && !h.includes('تلفن') && !h.includes('ولی'))) idxNum = i;
      if(h.includes('تلفن') || h.includes('ولی')) idxPhone = i;
      else if(h.includes('ردیف') && idxNum<0) idxNum = i;
    });
    rows = rows.slice(1);
  }
  const out = [];
  rows.forEach(r=>{
    if(!r.some(c=>c!=='')) return;
    let firstName='', lastName='', number='', nationalId='', fatherName='', parentPhone='';
    if(idxFull>=0){
      const full = r[idxFull]||'';
      const bits = full.split(/\s+/).filter(Boolean);
      firstName = bits.shift()||''; lastName = bits.join(' ');
      number = idxNum>=0 ? (r[idxNum]||'') : '';
    } else if(idxFirst>=0 || idxLast>=0){
      firstName = idxFirst>=0 ? (r[idxFirst]||'') : '';
      lastName = idxLast>=0 ? (r[idxLast]||'') : '';
      number = idxNum>=0 ? (r[idxNum]||'') : '';
    } else {
      const full = r[0]||'';
      const bits = full.split(/\s+/).filter(Boolean);
      firstName = bits.shift()||'';
      lastName = bits.join(' ');
      number = r[1]||'';
    }
    if(idxNid>=0) nationalId = r[idxNid]||'';
    if(idxFather>=0) fatherName = r[idxFather]||'';
    if(idxPhone>=0) parentPhone = r[idxPhone]||'';
    if(firstName || lastName) out.push({firstName,lastName,number,nationalId,fatherName,parentPhone});
  });
  return out;
}
function openImportModal(){
  openModal('افزودن دانش‌آموزان از اکسل', `

      <label>بارگذاری فایل اکسل یا CSV</label>

      <p id="importPreview" style="font-size:12.5px;color:var(--primary);margin-top:6px;font-weight:600"></p>

    <div class="field"><textarea id="importText" placeholder="علی رضایی, ۰۰۱۲۳۴۵۶۷۸, ۱, رضا رضایی, ۰۹۱۲۱۲۳۴۵۶۷"></textarea>
      <p style="font-size:12px;color:var(--ink-soft);margin-top:6px">هر خط به ترتیب: نام و نام خانوادگی، کد ملی (اختیاری)، شماره دانش‌آموزی، نام پدر، شماره تلفن ولی — با کاما یا تب جدا شود.</p>

      <button class="btn primary" id="doImportBtn">افزودن به کلاس</button>
      <button class="btn ghost" onclick="closeModal()">انصراف</button>
    </div>`);

  let excelStudents = [];
  document.getElementById('importExcelFile').addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const isCsv = /\.csv$/i.test(file.name);
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        let wb;
        if(isCsv){
          wb = XLSX.read(ev.target.result, {type:'string'});
        } else {
          wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
        }
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false});
        excelStudents = parseImportedRows(rows);
        document.getElementById('importPreview').textContent = excelStudents.length ? (excelStudents.length + ' دانش‌آموز از فایل خوانده شد.') : 'دانش‌آموزی در فایل پیدا نشد.';
      }catch(err){
        document.getElementById('importPreview').textContent = 'خواندن فایل ممکن نشد — از فرمت xlsx یا csv استفاده کنید.';
        document.getElementById('importPreview').style.color = 'var(--absent)';
      }
    };
    if(isCsv) reader.readAsText(file, 'UTF-8');
    else reader.readAsArrayBuffer(file);
  });

  document.getElementById('doImportBtn').addEventListener('click', ()=>{
    let list = excelStudents.slice();
    const text = document.getElementById('importText').value;
    const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
    lines.forEach(line=>{
      const parts = line.split(/[,\t]/).map(p=>p.trim()).filter(Boolean);
      const namePart = parts[0] || '';
      const nationalId = parts[1] || '';
      const number = parts[2] || '';
      const fatherName = parts[3] || '';
      const parentPhone = parts[4] || '';
      const nameBits = namePart.split(/\s+/);
      const firstName = nameBits.shift() || '';
      const lastName = nameBits.join(' ');
      if(firstName) list.push({firstName,lastName,number,nationalId,fatherName,parentPhone});
    });
    if(!list.length){ toast('چیزی برای افزودن پیدا نشد'); return; }
    let nextNum = studentsOfClass(currentClassId).length;
    list.forEach(st=>{
      nextNum++;
      DATA.students.push({id:uid(), classId:currentClassId, firstName:st.firstName, lastName:st.lastName||'', number: st.number || String(nextNum), nationalId: st.nationalId||'', fatherName: st.fatherName||'', parentPhone: st.parentPhone||'', order: DATA.students.length});
    });
    saveData(); closeModal(); viewStudents();
    toast(list.length + ' دانش‌آموز اضافه شد');
  });
}

function viewAttendance(){
  document.getElementById('content').innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div>
          <h3>${jalaaliKeyToLabel(selectedAttDate)} · ${weekdayOfKey(selectedAttDate)}</h3>
          <div class="hint" id="attCountHint"></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap" class="no-print">
          <button class="btn sm" onclick="attShift(1)">روز بعد ◂</button>
          <button class="btn sm" onclick="attShift(-1)">▸ روز قبل</button>
          <button class="btn sm success" onclick="markAllPresent()">همه حاضر</button>
        </div>
      </div>
      <div class="panel-body" style="padding-top:0">
        <div class="search-box no-print" style="margin:14px 0 4px"><span class="search-ic">${ICON_SEARCH_SM}</span><input type="text" id="attendanceSearchInput" placeholder="جست‌وجوی نام دانش‌آموز…" value="${esc(attendanceSearch)}" autocomplete="off"></div>
      </div>
      <div class="panel-body" style="padding:0" id="attendanceListHolder"></div>
    </div>`;
  const searchInput = document.getElementById('attendanceSearchInput');
  searchInput.addEventListener('input', e=>{ attendanceSearch = e.target.value; attendancePage = 1; renderAttendanceList(); });
  renderAttendanceList();
}
function renderAttendanceList(){
  const holder = document.getElementById('attendanceListHolder');
  if(!holder) return;
  const allStudents = studentsOfClass(currentClassId).filter(s=> fullName(s).includes(attendanceSearch));
  const pg = paginate(allStudents, attendancePage);
  const students = pg.items;
  const rec = DATA.attendance[selectedAttDate] || {};
  const statuses = [['present','حاضر',ICON_BADGE_CHECK_SM,'var(--present)'],['absent','غایب',ICON_BADGE_X_SM,'var(--absent)'],['late','تأخیر',ICON_BADGE_CLOCK_SM,'var(--late)'],['excused','موجه',ICON_BADGE_SHIELD_SM,'var(--excused)']];

  const countHint = document.getElementById('attCountHint');
  if(countHint) countHint.textContent = allStudents.length + ' دانش‌آموز';

  const rows = students.map((s,idx)=>{
    const st = rec[s.id] || '';
    const chips = statuses.map(([key,label,icon,color])=>
      `<button class="chip ${key} ${st===key?'on':''}" data-status="${key}" onclick="setAttendance('${s.id}','${key}')"><span class="chip-badge" style="color:${color}">${icon}</span>${label}</button>`
    ).join('');
    return `<div class="att-row" id="attRow_${s.id}">
      <div class="att-num-col"><span class="att-num">${pg.start+idx+1}</span></div>
      <div class="att-name">${avatarHTML(fullName(s))}<div><div>${esc(fullName(s))}</div><div style="font-size:11px;color:var(--ink-faint);font-weight:400">شماره ${esc(s.number||'—')}</div></div></div>
      <div class="att-choices-grid">${chips}</div>
    </div>`;
  }).join('');

  holder.innerHTML = allStudents.length ? `<div class="att-table-scroll"><div class="att-table">
      <div class="att-thead"><div class="th-num">ردیف</div><div class="th-name">دانش‌آموز</div><div class="th-status-grid"><span>حاضر</span><span>غایب</span><span>تأخیر</span><span>موجه</span></div></div>
      ${rows}
    </div></div>
    ${paginationBarHtml(pg, 'gotoAttendancePage', 'دانش‌آموز')}` : `<div class="empty"><div class="mark">✓</div><h3>${attendanceSearch?'دانش‌آموزی پیدا نشد':'ابتدا دانش‌آموز اضافه کنید'}</h3><p>${attendanceSearch?'عبارت جست‌وجو را تغییر دهید.':'برای ثبت حضور و غیاب باید حداقل یک دانش‌آموز در این کلاس داشته باشید.'}</p></div>`;
}
function attShift(delta){ selectedAttDate = shiftJalaliKey(selectedAttDate, delta); attendancePage = 1; viewAttendance(); }
function setAttendance(studentId, status){
  if(!DATA.attendance[selectedAttDate]) DATA.attendance[selectedAttDate] = {};
  const rec = DATA.attendance[selectedAttDate];
  rec[studentId] = (rec[studentId]===status) ? undefined : status;
  if(rec[studentId]===undefined) delete rec[studentId];
  saveData();
  /* آپدیت مستقیم همان ردیف بدون بازسازی کل جدول — تا اسکرول افقی جابه‌جا نشود */
  const row = document.getElementById('attRow_'+studentId);
  if(row){
    const st = rec[studentId] || '';
    row.querySelectorAll('.chip[data-status]').forEach(btn=>{
      btn.classList.toggle('on', btn.dataset.status===st);
    });
  } else {
    renderAttendanceList();
  }
}
function markAllPresent(){
  if(!DATA.attendance[selectedAttDate]) DATA.attendance[selectedAttDate] = {};
  studentsOfClass(currentClassId).forEach(s=> DATA.attendance[selectedAttDate][s.id] = 'present');
  saveData(); viewAttendance();
  toast('حضور همه دانش‌آموزان ثبت شد');
}

function setGrade(studentId, field, value){
  if(!DATA.grades[studentId]) DATA.grades[studentId] = {};
  if(!DATA.grades[studentId][currentSubject]) DATA.grades[studentId][currentSubject] = {};
  const v = (field==='descriptive') ? value : (value===''? null : Number(value));
  DATA.grades[studentId][currentSubject][field] = v;
  if((field==='classwork' || field==='exam') && v!=null){
    if(!DATA.gradeHistory[studentId]) DATA.gradeHistory[studentId] = {};
    if(!DATA.gradeHistory[studentId][currentSubject]) DATA.gradeHistory[studentId][currentSubject] = [];
    DATA.gradeHistory[studentId][currentSubject].push({value:v, field, dateKey: todayJalaliKey()});
  }
  saveData();
}
function addSubject(){
  openModal('درس جدید', `
    <div class="field"><label>نام درس</label><input type="text" id="newSubjectName" placeholder="مثلاً ریاضی"></div>
    <div class="form-actions">
      <button class="btn primary" id="saveSubjectBtn">افزودن</button>
      <button class="btn ghost" onclick="closeModal()">انصراف</button>
    </div>`);
  document.getElementById('saveSubjectBtn').addEventListener('click', ()=>{
    const name = document.getElementById('newSubjectName').value.trim();
    if(!name){ toast('نام درس را وارد کنید'); return; }
    if(!DATA.subjects.includes(name)) DATA.subjects.push(name);
    currentSubject = name;
    saveData(); closeModal(); viewGrades();
  });
}

function viewAssignments(){
  if(openAssignmentId) return viewAssignmentDetail(openAssignmentId);
  const fullList = DATA.assignments.filter(a=>a.classId===currentClassId).sort((a,b)=> j2dFromKey(b.dateKey) - j2dFromKey(a.dateKey));
  const pg = paginate(fullList, assignmentsListPage);
  const list = pg.items;
  const students = studentsOfClass(currentClassId);
  const todayJdn = j2dFromKey(todayJalaliKey());
  const rows = list.map(a=>{
    const statusMap = DATA.assignmentStatus[a.id] || {};
    const doneCount = students.filter(s=>statusMap[s.id]==='done').length;
    const missingCount = students.filter(s=>statusMap[s.id]==='missing').length;
    const lateCount = students.filter(s=>statusMap[s.id]==='late').length;
    const pct = students.length ? Math.round((doneCount/students.length)*100) : 0;
    const color = assignColor(pct);
    const isOverdue = a.dueDateKey && j2dFromKey(a.dueDateKey) < todayJdn && pct < 100;
    const dueText = a.dueDateKey ? `مهلت: ${jalaaliKeyToLabel(a.dueDateKey)}${isOverdue?' (گذشته)':''}` : '';
    return `<div class="assign-row" onclick="openAssignmentId='${a.id}';assignDetailPage=1;render()">

        <span class="type-badge ${a.type==='تکلیف'?'hw':'activity'}">${esc(a.type)}</span>
        <div class="assign-title">${esc(a.title)}</div>
        <div class="assign-meta">ثبت: ${jalaaliKeyToLabel(a.dateKey)}${dueText?' · <span class="'+(isOverdue?'assign-overdue':'')+'">'+dueText+'</span>':''}</div>
        <div class="assign-substats">انجام داده: ${doneCount} · انجام نداده: ${missingCount} · با تأخیر: ${lateCount} · از ${students.length} دانش‌آموز</div>
      </div>
      <div style="display:flex;align-items:center;gap:9px">
        <div class="assign-progress"><div style="width:${pct}%;background:${color}"></div></div>
        <div class="assign-pct" style="color:${color}">${pct}٪</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="panel">
      <div class="panel-head"><h3>لیست تکالیف و فعالیت‌ها</h3><button class="btn sm success no-print" onclick="openAddAssignment()">+ افزودن</button></div>
      <div class="panel-body" style="padding:0">
        ${fullList.length ? `<div class="assign-thead"><span>عنوان</span><span>پیشرفت</span></div>${rows}
        ${paginationBarHtml(pg, 'gotoAssignmentsListPage', 'مورد')}` : `<div class="empty"><div class="mark">☑</div><h3>هنوز تکلیفی ثبت نشده</h3><p>یک تکلیف یا فعالیت اضافه کنید و وضعیت انجام‌دادن هر دانش‌آموز را ثبت کنید.</p></div>`}
      </div>
    </div>`;
}
/* ---------- انتخاب تاریخ ساده و مطمئن: سه select (روز/ماه/سال) — بدون هیچ Grid یا Popover سفارشی ---------- */
function dateSelectHtml(id, selectedKey){
  const [jy,jm,jd] = selectedKey.split('-').map(Number);
  const curY = todayJalali().jy;
  const years = [curY-1, curY, curY+1, curY+2];
  return `<div class="date-select-row" id="${id}">
    <select class="d-day">${Array.from({length:31},(_,i)=>i+1).map(d=>`<option value="${d}" ${d===jd?'selected':''}>${d}</option>`).join('')}</select>
    <select class="d-month">${J_MONTHS.map((m,i)=>`<option value="${i+1}" ${i+1===jm?'selected':''}>${esc(m)}</option>`).join('')}</select>
    <select class="d-year">${years.map(y=>`<option value="${y}" ${y===jy?'selected':''}>${y}</option>`).join('')}</select>
  </div>`;
}
function getDateSelectValue(id){
  const el = document.getElementById(id);
  if(!el) return null;
  const d = el.querySelector('.d-day').value;
  const m = el.querySelector('.d-month').value;
  const y = el.querySelector('.d-year').value;
  return `${y}-${m}-${d}`;
}

function openEditAssignment(id){ openAssignmentForm(id); }

function setAssignStatus(assignId, studentId, status){
  const map = DATA.assignmentStatus[assignId] || (DATA.assignmentStatus[assignId]={});

function deleteAssignment(id){

/* =======================================================================
   ارسال فعالیت/تکلیف برای دانش‌آموزان — فقط تولید متن آماده + Copy/Share
   (بدون اتصال به هیچ پیام‌رسانی؛ ارسال واقعی برعهده خود معلم است)
======================================================================= */
function assignmentMessageLines(a, studentName){
  const lines = [];
  lines.push('با سلام');
  if(studentName) lines.push(`نام دانش‌آموز: ${studentName}`);
  lines.push(`عنوان فعالیت: ${a.title}`);
  if(a.description) lines.push(`توضیح: ${a.description}`);
  if(a.dueDateKey) lines.push(`مهلت انجام: ${jalaaliKeyToLabel(a.dueDateKey)}`);
  lines.push('لطفاً این فعالیت را انجام دهید.');
  return lines;
}
function buildIndividualAssignmentMessage(a, student){
  return assignmentMessageLines(a, fullName(student)).join('\n');
}
function buildSharedAssignmentMessage(a, students, includeNames){
  const lines = [];
  if(includeNames && students.length){

/* =======================================================================
   آزمون‌ها — ثبت آزمون برگزارشده، نمرات و تحلیل نتایج (Rule-Based)
   توجه: ساخت آزمون/سؤال برعهده «Teacher AI Workspace» است؛ اینجا فقط ثبت و تحلیل نتیجه.
======================================================================= */
function examPct(score, total){ return total ? Math.round((Number(score)/Number(total))*100) : 0; }
function examColor(pct){
  if(pct>=EXAM_GOOD_PCT) return 'var(--present)';
  if(pct>=EXAM_ATTENTION_PCT) return 'var(--gold)';
  return 'var(--absent)';
}
function examPerfLabel(pct){
  if(pct>=EXAM_GOOD_PCT) return 'خوب';
  if(pct>=EXAM_ATTENTION_PCT) return 'متوسط';
  return 'نیازمند تمرین بیشتر';
}
function examsOfClass(){
  return DATA.exams.filter(e=>e.classId===currentClassId).sort((a,b)=> j2dFromKey(b.dateKey)-j2dFromKey(a.dateKey));
}
/* سوابق آزمون یک دانش‌آموز در همه کلاس‌ها (برای پرونده دانش‌آموز) */
function studentExamRecords(studentId, classId){
  return DATA.exams.filter(e=>e.classId===classId)
    .map(e=>{
      const sc = (DATA.examScores[e.id]||{})[studentId];
      if(sc==null) return null;
      const pct = examPct(sc, e.totalScore);
      return {exam:e, score:sc, pct, label:examPerfLabel(pct)};
    }).filter(Boolean)
    .sort((a,b)=> j2dFromKey(b.exam.dateKey)-j2dFromKey(a.exam.dateKey));
}
/* روند نتایج آزمون یک دانش‌آموز در یک درس خاص (حداقل ۲ آزمون لازم است) */
function computeExamTrend(studentId, classId, subject){
  const list = DATA.exams.filter(e=>e.classId===classId && e.subject===subject)
    .map(e=>{ const sc=(DATA.examScores[e.id]||{})[studentId]; return sc==null?null:{e, pct:examPct(sc,e.totalScore)}; })
    .filter(Boolean)
    .sort((a,b)=> j2dFromKey(a.e.dateKey)-j2dFromKey(b.e.dateKey));
  if(list.length < 2) return {status:'insufficient', count:list.length};
  const last = list[list.length-1], prev = list[list.length-2];
  const diff = last.pct - prev.pct;
  if(diff <= -10) return {status:'down', diff, list};
  if(diff >= 10) return {status:'up', diff, list};
  return {status:'flat', diff, list};
}
/* تحلیل کلی یک آزمون: میانگین، بیشترین/کمترین، مشارکت، قبولی، نیازمند توجه */
function computeExamAnalysis(examId){
  const exam = DATA.exams.find(x=>x.id===examId);
  if(!exam) return null;
  const students = studentsOfClass(exam.classId);
  const scoresMap = DATA.examScores[examId] || {};
  const entries = students.map(s=>({s, score: scoresMap[s.id]})).filter(x=>x.score!=null);
  const pcts = entries.map(x=>examPct(x.score, exam.totalScore));
  const avgPct = pcts.length ? Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length) : 0;
  const avgScore = entries.length ? Math.round((entries.reduce((a,x)=>a+Number(x.score),0)/entries.length)*100)/100 : null;
  const maxScore = entries.length ? Math.max(...entries.map(x=>Number(x.score))) : null;
  const minScore = entries.length ? Math.min(...entries.map(x=>Number(x.score))) : null;
  const goodCount = pcts.filter(p=>p>=EXAM_GOOD_PCT).length;
  const attentionCount = pcts.filter(p=>p<EXAM_ATTENTION_PCT).length;
  const participationPct = students.length ? Math.round((entries.length/students.length)*100) : 0;
  return {exam, students, entries, avgPct, avgScore, maxScore, minScore, goodCount, attentionCount, participationPct, totalStudents: students.length, registeredCount: entries.length};
}
/* شناسایی دانش‌آموزان نیازمند توجه بر اساس این آزمون + روند + تکالیف/حضور (Rule-Based) */
function examAttentionList(examId){
  const a = computeExamAnalysis(examId);
  if(!a) return [];
  const out = [];
  a.entries.forEach(x=>{
    const pct = examPct(x.score, a.exam.totalScore);
    const trend = computeExamTrend(x.s.id, a.exam.classId, a.exam.subject);
    const reasons = [];
    if(pct < EXAM_ATTENTION_PCT) reasons.push('نمره پایین در این آزمون');
    if(trend.status==='down') reasons.push(`افت نسبت به آزمون قبلی (${Math.abs(trend.diff)}٪)`);
    const asg = computeAssignmentStats(x.s.id, a.exam.classId);
    if(asg.total>=2 && asg.pct<50) reasons.push('تکالیف ناقص');
    if(reasons.length) out.push({student:x.s, pct, reasons, suggestion: examSuggestion(reasons)});
  });
  return out;
}
function examSuggestion(reasons){
  if(reasons.some(r=>r.includes('افت'))) return 'بررسی علت افت و تمرین هدفمند در این درس';
  if(reasons.some(r=>r.includes('تکالیف'))) return 'بررسی ارتباط تکالیف ناقص با افت عملکرد و پیگیری تکالیف';
  if(reasons.length>=2) return 'گفت‌وگوی کوتاه با دانش‌آموز و تنظیم برنامه تمرینی';
  return 'مرور مبحث آزمون و تمرین بیشتر';
}

  const exam = DATA.exams.find(x=>x.id===examId);

    if(DATA.examScores[examId]) delete DATA.examScores[examId][studentId];
    saveData(); viewExamDetail(examId); return;
  }
  const v = Number(value);
  if(isNaN(v) || v<0 || v>exam.totalScore){
    toast(`نمره باید بین ۰ تا ${exam.totalScore} باشد`);

  if(!DATA.examScores[examId]) DATA.examScores[examId] = {};

/* =======================================================================
   پرونده دانش‌آموز
======================================================================= */
function openStudentProfile(id){
  profileStudentId = id;
  obsSelectedTags = [];
  render();
}
function closeStudentProfile(){
  profileStudentId = null;
  render();
}
function addNote(studentId){
  const ta = document.getElementById('newNoteText');
  const text = ta.value.trim();
  if(!text){ toast('متن یادداشت را وارد کنید'); return; }
  if(!DATA.notes[studentId]) DATA.notes[studentId] = [];
  DATA.notes[studentId].unshift({id:uid(), text, dateKey: todayJalaliKey()});
  saveData(); viewStudentProfile(studentId);
}
function deleteNote(studentId, noteId){
  DATA.notes[studentId] = (DATA.notes[studentId]||[]).filter(n=>n.id!==noteId);
  saveData(); viewStudentProfile(studentId);
}
function toggleObsTag(tag){
  const i = obsSelectedTags.indexOf(tag);
  if(i>=0) obsSelectedTags.splice(i,1); else obsSelectedTags.push(tag);
  viewStudentProfile(profileStudentId);
}
function submitObservation(studentId){
  if(!obsSelectedTags.length){ toast('حداقل یک مورد را انتخاب کنید'); return; }
  if(!DATA.observations[studentId]) DATA.observations[studentId] = [];
  DATA.observations[studentId].unshift({id:uid(), tags: obsSelectedTags.slice(), dateKey: todayJalaliKey()});
  obsSelectedTags = [];
  saveData(); viewStudentProfile(studentId);
}
function deleteObservation(studentId, obsId){
  DATA.observations[studentId] = (DATA.observations[studentId]||[]).filter(o=>o.id!==obsId);
  saveData(); viewStudentProfile(studentId);
}

/* =======================================================================
   گزارش قابل ارسال برای ولی — تولید متن کوتاه Rule-Based از داده‌های واقعی
======================================================================= */
function parentReportPieces(studentId, classId){
  const att = computeAttendanceStats(studentId);
  const asg = computeAssignmentStats(studentId, classId);
  const pieces = {};
  pieces.attendance = att.total ? `${att.pct}٪ حضور (${att.present} حاضر، ${att.absent} غایب از ${att.total} جلسه)` : null;

  const gradeParts = DATA.subjects.map(sub=>{
    const g = ((DATA.grades[studentId]||{})[sub])||{};
    const nums = [g.classwork, g.exam].filter(v=>v!=null && v!=='');
    if(!nums.length) return null;
    const avg = Math.round((nums.reduce((a,b)=>a+Number(b),0)/nums.length)*10)/10;
    return `${sub}: ${avg}`;
  }).filter(Boolean);
  pieces.grades = gradeParts.length ? gradeParts.join('، ') : null;

  const examRecs = studentExamRecords(studentId, classId);
  pieces.exam = examRecs.length ? `${examRecs[0].exam.subject} «${examRecs[0].exam.title}» — ${examRecs[0].score} از ${examRecs[0].exam.totalScore} (${examRecs[0].pct}٪, ${examRecs[0].label})` : null;

  pieces.assignments = asg.total ? `${asg.done} از ${asg.total} تکلیف انجام‌شده (${asg.pct}٪)` : null;

  const trends = DATA.subjects.map(sub=>computeSubjectTrend(studentId, sub));
  let trendText = null;
  if(trends.some(t=>t.status==='down')) trendText = 'روند کاهشی در برخی دروس مشاهده می‌شود.';
  else if(trends.some(t=>t.status==='up')) trendText = 'روند رو به رشد در برخی دروس مشاهده می‌شود.';
  else if(trends.some(t=>t.status==='flat')) trendText = 'روند عملکرد نسبتاً ثابت است.';
  pieces.trend = trendText;

  const descParts = DATA.subjects.map(sub=>{
    const g = ((DATA.grades[studentId]||{})[sub])||{};
    return g.descriptive ? `${sub}: ${g.descriptive}` : null;
  }).filter(Boolean);
  pieces.descriptive = descParts.length ? descParts.join(' — ') : null;

  const notes = DATA.notes[studentId] || [];
  pieces.note = notes.length ? notes[0].text : null;
  return pieces;
}
function buildParentReportText(studentId, classId, sel){
  const s = DATA.students.find(x=>x.id===studentId);
  const cls = classById(classId);
  const p = parentReportPieces(studentId, classId);
  const lines = ['گزارش عملکرد دانش‌آموز', `نام: ${fullName(s)}`, `کلاس: ${cls?cls.name:'—'}`];
  if(sel.attendance && p.attendance) lines.push(`وضعیت حضور: ${p.attendance}`);
  if(sel.grades && p.grades) lines.push(`عملکرد درسی: ${p.grades}`);
  if(sel.exams && p.exam) lines.push(`آخرین آزمون: ${p.exam}`);
  if(sel.trend && p.trend) lines.push(`روند عملکرد: ${p.trend}`);
  if(sel.assignments && p.assignments) lines.push(`فعالیت‌ها: ${p.assignments}`);
  if(sel.descriptive && p.descriptive) lines.push(`ارزیابی توصیفی: ${p.descriptive}`);
  if(sel.note && p.note) lines.push(`توضیحات معلم: ${p.note}`);
  return lines.join('\n');
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('متن کپی شد')).catch(()=>fallbackCopyText(text));
  } else fallbackCopyText(text);
}
function fallbackCopyText(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('متن کپی شد'); }
  catch(e){ toast('کپی خودکار ممکن نشد؛ متن را دستی انتخاب و کپی کنید'); }
  document.body.removeChild(ta);
}
function openParentReportModal(studentId, classId){
  const p = parentReportPieces(studentId, classId);
  const items = [
    {key:'attendance', label:'حضور و غیاب', has:!!p.attendance},
    {key:'grades', label:'نمرات', has:!!p.grades},
    {key:'exams', label:'آزمون‌ها', has:!!p.exam},
    {key:'assignments', label:'فعالیت‌ها و تکالیف', has:!!p.assignments},
    {key:'trend', label:'روند عملکرد', has:!!p.trend},
    {key:'descriptive', label:'ارزیابی توصیفی', has:!!p.descriptive},
    {key:'note', label:'یادداشت معلم', has:!!p.note}
  ];
  openModal('ارسال گزارش برای ولی', `
    <p style="font-size:12.5px;color:var(--ink-soft)">بخش‌هایی که می‌خواهید در پیام برای ولی باشد را انتخاب کنید. فقط بخش‌هایی که داده واقعی دارند قابل انتخاب‌اند.</p>
    <div style="display:flex;flex-direction:column;gap:9px;margin:12px 0">
      ${items.map(i=>`<label style="display:flex;align-items:center;gap:8px;font-size:13px;${i.has?'':'color:var(--ink-faint)'}">
        <input type="checkbox" id="pr_${i.key}" ${i.has?'checked':'disabled'}> ${esc(i.label)}${i.has?'':' (بدون داده)'}
      </label>`).join('')}
    </div>
    <div class="form-actions">
      <button class="btn primary" id="genParentReportBtn">تولید متن پیام</button>
      <button class="btn ghost" onclick="closeModal()">انصراف</button>
    </div>
    <div id="parentReportOutput"></div>
  `);
  document.getElementById('genParentReportBtn').addEventListener('click', ()=>{
    const sel = {};
    items.forEach(i=>{ const el=document.getElementById('pr_'+i.key); sel[i.key] = i.has && el.checked; });
    const text = buildParentReportText(studentId, classId, sel);
    document.getElementById('parentReportOutput').innerHTML = `
      <div class="field" style="margin-top:8px"><label>متن پیام</label><textarea id="parentReportText" rows="9" style="width:100%">${esc(text)}</textarea></div>
      <div class="form-actions">
        <button class="btn" id="copyParentReportBtn">📋 کپی متن</button>
        <button class="btn success" id="shareParentReportBtn">📤 اشتراک‌گذاری</button>
      </div>`;

const BACKUP_REMINDER_DAYS = 14;
function downloadBackupFile(){
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'پشتیبان-دفتر-کلاس-' + todayJalaliKey() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function backupStatusHtml(){
  const last = DATA.meta.lastBackupAt;
  if(!last) return `⚪ هنوز پشتیبان‌گیری انجام نشده. توصیه می‌شود همین حالا یک نسخه پشتیبان دریافت کنید.`;
  const daysAgo = Math.floor((Date.now() - last) / (24*60*60*1000));
  const base = `آخرین پشتیبان‌گیری: ${formatBackupTimestamp(last)}`;
  if(daysAgo >= BACKUP_REMINDER_DAYS){
    return `🟡 ${base} (${daysAgo} روز پیش) — بهتر است دوباره پشتیبان بگیرید.`;
  }
  return `🟢 ${base}`;
}
function downloadExcelSheet(rows, sheetName, filenamePrefix){
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  const cls = classById(currentClassId);
  XLSX.writeFile(wb, `${filenamePrefix}-${cls?cls.name:''}-${todayJalaliKey()}.xlsx`);
}
function exportStudentsExcel(){
  const students = studentsOfClass(currentClassId);
  const rows = [['ردیف','نام','نام خانوادگی','شماره دانش‌آموزی','کد ملی']];
  students.forEach((s,i)=> rows.push([i+1, s.firstName||'', s.lastName||'', s.number||'', s.nationalId||'']));
  downloadExcelSheet(rows, 'دانش‌آموزان', 'دانش‌آموزان');
}
function exportAttendanceExcel(){
  const students = studentsOfClass(currentClassId);
  const rows = [['تاریخ','نام دانش‌آموز','وضعیت']];
  const STATUS_FA = {present:'حاضر', absent:'غایب', late:'تأخیر', excused:'موجه'};
  Object.keys(DATA.attendance).sort((a,b)=>j2dFromKey(a)-j2dFromKey(b)).forEach(dateKey=>{
    const rec = DATA.attendance[dateKey];
    students.forEach(s=>{
      const st = rec[s.id];
      if(st) rows.push([jalaaliKeyToLabel(dateKey), fullName(s), STATUS_FA[st]||st]);
    });
  });
  downloadExcelSheet(rows, 'حضور و غیاب', 'حضور-غیاب');
}
function exportGradesExcel(){
  const students = studentsOfClass(currentClassId);
  const rows = [['نام دانش‌آموز','درس','نمره کلاسی','نمره امتحان','میانگین','توصیفی']];
  students.forEach(s=>{
    DATA.subjects.forEach(sub=>{
      const g = ((DATA.grades[s.id]||{})[sub])||{};
      if(g.classwork==null && g.exam==null && !g.descriptive) return;
      const nums = [g.classwork, g.exam].filter(v=>v!=null);
      const avg = nums.length ? Math.round((nums.reduce((a,b)=>a+Number(b),0)/nums.length)*10)/10 : '';
      rows.push([fullName(s), sub, g.classwork!=null?g.classwork:'', g.exam!=null?g.exam:'', avg, g.descriptive||'']);
    });
  });
  downloadExcelSheet(rows, 'نمرات', 'نمرات');
}
function exportAllExamsExcel(){
  const exams = examsOfClass();
  const rows = [['عنوان آزمون','درس','نوع','تاریخ','نمره کل','میانگین کلاس','درصد مشارکت']];

function exportAssignmentsExcel(){
  const students = studentsOfClass(currentClassId);
  const list = DATA.assignments.filter(a=>a.classId===currentClassId);
  const rows = [['عنوان','نوع','تاریخ ثبت','مهلت','نام دانش‌آموز','وضعیت']];
  const STATUS_FA = {done:'انجام داده', missing:'انجام نداده'};
  list.forEach(a=>{
    const statusMap = DATA.assignmentStatus[a.id] || {};
    students.forEach(s=>{
      const st = statusMap[s.id];
